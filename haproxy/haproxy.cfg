global
    maxconn 2048
    tune.listener.default-shards by-thread
    tune.listener.multi-queue on
    tune.pipesize 262144
    maxpipes 0
    nbthread 4

defaults
    mode    http
    option  httplog
    timeout connect 15s
    timeout client  30s
    timeout server  45s

frontend http_front
    bind *:80
    default_backend hyperf_backend

backend hyperf_backend
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    server api1 unix@/http/api_1.sock check
    server api2 unix@/http/api_2.sock check
    server api3 unix@/http/api_3.sock check
